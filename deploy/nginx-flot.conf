# Сайт nginx для приложения «Управление простоями флота».
# Установка: sudo cp deploy/nginx-flot.conf /etc/nginx/sites-available/flot
#            sudo ln -s /etc/nginx/sites-available/flot /etc/nginx/sites-enabled/flot
#            sudo nginx -t && sudo systemctl reload nginx
server {
    listen 80;
    # Замените на доменное имя или IP сервера; "_" — принимать запросы по любому имени
    server_name _;

    # Совпадает с MAX_CONTENT_LENGTH в config.py (16 МБ) — загрузка файлов к простоям и импорт Excel
    client_max_body_size 16m;

    access_log /var/log/nginx/flot.access.log;
    error_log  /var/log/nginx/flot.error.log;

    # Статика (CSS, JS, иконка) отдаётся nginx напрямую, минуя приложение
    location /static/ {
        alias /opt/flot/Flot/static/;
        expires 7d;
        access_log off;
    }

    # Папку uploads nginx НЕ отдаёт: файлы доступны только после входа, через приложение (/uploads/...)

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;

        proxy_connect_timeout 10s;
        # Совпадает с timeout в gunicorn.conf.py: генерация отчётов и импорт
        proxy_read_timeout    120s;
        proxy_send_timeout    120s;
    }
}
