{% extends "base.html" %}

{% block title %}Вход в систему{% endblock %}

{% block content_login %}
<div class="login-container">
    <div class="container">
        <div class="row justify-content-center align-items-center min-vh-100">
            <div class="col-md-4 col-sm-8">
                <div class="card shadow-lg">
                    <div class="card-header bg-primary text-white text-center">
                        <h3><i class="fas fa-ship"></i> Управление простоями</h3>
                        <h5>Вход в систему</h5>
                    </div>
                    <div class="card-body">
                        <form method="POST">
                            <div class="mb-3">
                                <label for="username" class="form-label">Имя пользователя</label>
                                <input type="text" class="form-control form-control-lg" id="username" name="username" required autofocus>
                            </div>
                            <div class="mb-3">
                                <label for="password" class="form-label">Пароль</label>
                                <input type="password" class="form-control form-control-lg" id="password" name="password" required>
                            </div>
                            <button type="submit" class="btn btn-primary btn-lg w-100">
                                <i class="fas fa-sign-in-alt"></i> Войти
                            </button>
                        </form>
                    </div>
                </div>
                <!-- Только подпись разработчика (без кнопки) -->
                <div class="text-center mt-3">
                    <small class="text-white-50">Разработчик: Шаров Максим</small>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
